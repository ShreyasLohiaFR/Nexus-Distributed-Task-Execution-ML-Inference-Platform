name: Verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexus_test
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: ci-only-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/nexus_test
      DATABASE_USER: nexus
      DATABASE_PASSWORD: ci-only-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify
      - run: node --check src/main/resources/static/app.js
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ml/requirements.txt pytest httpx
      - run: python -m pytest -q tests/test_ml.py tests/test_benchmark_matrix.py
      - run: python -m ml.model
  end-to-end:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend, ml]
    env:
      DATABASE_PASSWORD: disposable-ci-db-password
      NEXUS_API_KEY: disposable-ci-workspace-key-1234
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: python scripts/smoke.py
      - name: Verify recovery after worker process termination
        run: python scripts/recovery.py --isolated-compose
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
      - name: Test real browser against live database and workers
        run: python scripts/browser_test.py
      - name: Benchmark one worker process
        run: python scripts/benchmark.py --jobs 1000 --clients 8 --timeout 180 --workers-label 1x2 --output benchmark-results-1x2.json
      - name: Benchmark two worker processes
        run: |
          docker compose up -d --no-build --wait --scale worker=2
          python scripts/benchmark.py --jobs 1000 --clients 8 --timeout 180 --workers-label 2x2 --output benchmark-results-2x2.json
      - name: Repeat scaling experiment across 1, 2 and 4 worker processes
        run: python scripts/benchmark_matrix.py --isolated-compose --jobs 1000 --repeats 3 --workers 1 2 4 --output scaling-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-reports
          path: |
            benchmark-results-*.json
            nexus-dashboard.png
            scaling-results/*.json
          if-no-files-found: ignore
      - name: Diagnose failed stack
        if: failure()
        run: docker compose logs --tail=200
      - name: Remove disposable test stack
        if: always()
        run: docker compose down -v
