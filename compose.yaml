x-service-env: &service-env
  DATABASE_URL: jdbc:postgresql://db:5432/nexus
  DATABASE_USER: nexus
  DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
  NEXUS_API_KEY: ${NEXUS_API_KEY:?Set NEXUS_API_KEY in .env}
  ML_URL: http://ml:8000
  BIND_ADDRESS: 0.0.0.0
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes: [nexus-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U nexus -d nexus']
      interval: 3s
      timeout: 3s
      retries: 30
  ml:
    build:
      context: .
      dockerfile: ml/Dockerfile
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health", timeout=3)']
      interval: 5s
      timeout: 4s
      retries: 30
  api:
    build: .
    environment:
      <<: *service-env
      WORKER_ENABLED: 'false'
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:8080/actuator/health']
      interval: 4s
      timeout: 3s
      retries: 30
  worker:
    build: .
    environment:
      <<: *service-env
      WORKER_ENABLED: 'true'
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      NEXUS_WORKER_IDLE_POLL_MS: ${WORKER_IDLE_POLL_MS:-100}
      SPRING_SQL_INIT_MODE: never
    depends_on:
      api:
        condition: service_healthy
      ml:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:8080/actuator/health']
      interval: 4s
      timeout: 3s
      retries: 30
    stop_grace_period: 25s
volumes:
  nexus-data:
