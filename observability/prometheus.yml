global:
  scrape_interval: 5s
  evaluation_interval: 5s
scrape_configs:
  - job_name: nexus-api
    metrics_path: /actuator/prometheus
    http_headers:
      X-API-Key:
        files: [/run/secrets/nexus_metrics_key]
    static_configs:
      - targets: ["api:8080"]
  - job_name: nexus-worker
    metrics_path: /actuator/prometheus
    http_headers:
      X-API-Key:
        files: [/run/secrets/nexus_metrics_key]
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8080
        refresh_interval: 5s
