spring.application.name=nexus
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nexus}
spring.datasource.username=${DATABASE_USER:nexus}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=10
spring.sql.init.mode=always
server.port=${PORT:8080}
server.address=${BIND_ADDRESS:127.0.0.1}
server.error.include-message=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
nexus.api-key=${NEXUS_API_KEY:}
nexus.worker.enabled=${WORKER_ENABLED:false}
nexus.worker.concurrency=${WORKER_CONCURRENCY:2}
nexus.ml-url=${ML_URL:http://localhost:8000}
spring.task.scheduling.pool.size=2
